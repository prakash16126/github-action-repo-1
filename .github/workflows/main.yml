name: Job - Day-3

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      username:
        description: "Enter your username"
        required: true
        default: "Prakash"
        type: string

      environment:
        description: "Select deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

      deploy:
        description: "Do you want to deploy?"
        required: true
        default: true
        type: boolean

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Inputs
        run: |
          echo "Username: ${{ inputs.username }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Deploy: ${{ inputs.deploy }}"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build


  test:
    name: Test Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test


  security:
    name: Security and Deployment
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Security Check
        run: echo "Security scan completed"

      - name: Deploy
        if: ${{ inputs.deploy == true }}
        run: |
          echo "Deploying to ${{ inputs.environment }}"
          echo "Deployed by ${{ inputs.username }}"

      - name: Skip Deployment
        if: ${{ inputs.deploy == false }}
        run: echo "Deployment skipped"

      - name: Rollback
        if: failure()
        run: echo "Rollback is done"


  info:
    name: GitHub Context Information
    runs-on: ubuntu-latest

    steps:
      - name: Output Job Information
        run: echo '${{ toJson(github) }}'
