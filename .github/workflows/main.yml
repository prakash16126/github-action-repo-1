name: Job - Day 2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  ci:
    name: React Application CI
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build application
      - name: Build Application
        run: npm run build

      # 5. Display build files
      - name: Display Build Output
        run: ls -la dist

      # 6. Upload production build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
