name: Job - Day 1

on:
  push:
    branches:
      - main
      - master
  
  workflow_dispatch: 
jobs:
  build:
    name: Basic CI Workflow
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Display repository files
      - name: List Repository Files
        run: ls -la

      # 3. Run a basic command
      - name: Display Message
        run: echo "Hello from GitHub Actions!"

      # 4. Create a sample file
      - name: Create Artifact
        run: |
          echo "GitHub Actions Day 1" > build-output.txt
          echo "Workflow executed successfully!" >> build-output.txt

      # 5. Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: day1-artifact
          path: build-output.txt

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      # 6. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 7. Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      # 8. Analyze the code
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
